# TerraSpectra — Reproducible 3D-CNN Training Pipeline Configuration
# Schema Version: 2.0.0
# Author: Harsh (ML Engineering Lead)
# Status: Initial development defaults calibrated for 4 GB VRAM (RTX 3050 Laptop GPU)

training:
  tuned: false
  epochs: 30
  batch_size: 16
  num_workers: 0

optimizer:
  name: "AdamW"
  learning_rate: 0.0003
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8

loss:
  name: "CrossEntropyLoss"
  label_smoothing: 0.0
  use_class_weights: false
  class_weights: null

reproducibility:
  random_seed: 42
  deterministic: true

validation:
  val_every_n_epochs: 1
  use_test_set_during_training: false

checkpointing:
  checkpoint_dir: "ml/artifacts/checkpoints"
  best_criterion: "val_loss"
  best_mode: "min"
  save_recovery_every_n_epochs: 5

logging:
  run_id: "run_001_3dcnn_baseline"
  output_dir: "ml/artifacts/runs"
  track_metrics:
    - "train_loss"
    - "val_loss"

hardware:
  device_preference: "auto"
  allow_cpu_fallback: true
  target_gpu: "NVIDIA GeForce RTX 3050 Laptop GPU"
  vram_limit_gb: 4.0
