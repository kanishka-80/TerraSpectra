# TerraSpectra — Finalized Week 2 3D-CNN Model Configuration
# Schema Version: 2.0.0
# Author: Harsh (ML Engineering Lead)
# Status: Architecture contract finalized for Day 9 cnn3d.py implementation

metadata:
  model_name: "terraspectra_3dcnn_baseline"
  hybrid_model_name: "terraspectra_hybrid_3dcnn_vit"
  architecture_version: "0.2.0"
  config_version: "2.0.0"
  phase: "week2_3dcnn_baseline"

input:
  tensor_convention: "B_C_D_H_W"      # [Batch, Channels, Depth, Height, Width]
  dataloader_adapter: "4d_to_5d_unsqueeze_channel" # Adapts Khushi's [B, D, H, W] -> [B, 1, D, H, W]
  in_channels: 1                      # Volumetric scalar reflectance field
  spectral_depth: null                # Symbolic D (sensor-dependent; awaiting Khushi's locked scene)
  min_spectral_depth: 4
  patch_height: 9                     # Aligned with Khushi's extract_patches(patch_size=9) default
  patch_width: 9
  dtype: "float32"
  normalization: "normalized_reflectance_0_1"

cnn3d:
  num_blocks: 3
  blocks:
    - name: "conv_block_1"
      in_channels: 1
      out_channels: 8
      kernel_size: [7, 3, 3]          # [k_depth, k_height, k_width]
      stride: [2, 1, 1]               # Downsample spectral axis; preserve 9x9 spatial window
      padding: [3, 1, 1]
    - name: "conv_block_2"
      in_channels: 8
      out_channels: 16
      kernel_size: [5, 3, 3]
      stride: [2, 1, 1]
      padding: [2, 1, 1]
    - name: "conv_block_3"
      in_channels: 16
      out_channels: 32
      kernel_size: [3, 3, 3]
      stride: [1, 1, 1]
      padding: [1, 0, 0]              # Unpadded spatial 3x3 reduces border effects (9x9 -> 7x7)
  activation: "GELU"
  normalization: "BatchNorm3d"
  dropout_3d: 0.1
  pooling:
    type: "AdaptiveAvgPool3d"
    standalone_output_size: [1, 1, 1] # Produces [B, 32, 1, 1, 1] -> Flatten [B, 32] -> Linear [B, 128]
    vit_ready_output_size: [4, 5, 5]  # Produces [B, 32, 4, 5, 5] -> 25 tokens x 128 dim for Week 3 ViT
  feature_dim: 128

classification:
  class_config_ref: "ml/configs/classes.yaml"
  labels_confirmed: false             # Blocked until Khushi completes label audit on target scene
  num_classes: null                   # Bound dynamically from classes.yaml at runtime
  head_structure:
    dropout: 0.2
    linear_in_features: 128
  output_convention: "raw_unnormalized_logits"
  inference_activation: "softmax"
