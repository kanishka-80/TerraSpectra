# TerraSpectra – Vision Transformer (ViT) Branch Configuration
# Schema Version: 1.1.0
# Author: Harsh (ML Engineering Lead)
# Status: Day 17 Standalone ViT Training & Checkpoint Workflow Connected

vit:
  name: "terraspectra_spatial_spectral_vit"
  status: "training_workflow_day17"
  token_source: "SpatialSpectral3DExtractor.extract_vit_tokens"
  spatial_grid_size: 5    # 5 x 5 = 25 spatial tokens
  num_tokens: 25
  input_token_dim: 128
  embed_dim: 128          # Matches Conv3DBlock final channel dimension (128)
  num_heads: 4            # 32 dims per attention head
  num_layers: 2           # Lightweight depth tailored for 4GB VRAM and limited crop labels
  mlp_ratio: 2.0          # Feed-forward hidden dimension = 256
  spectral_bins: 16       # Adaptive spectral bins when tokenizing raw 5D cubes directly
  dropout: 0.10
  attention_dropout: 0.10
  use_cls_token: true
  positional_encoding: "learnable_1d_interpolated"
  pooling: "cls"          # Options: "cls" or "mean"
  norm_first: true        # Pre-LayerNorm Transformer stability

# Overrides applied on top of ml/configs/training.yaml when model_type == "vit"
training_overrides:
  training:
    batch_size: 8         # Calibrated for RTX 3050 4GB VRAM smoke/controlled runs
  checkpointing:
    checkpoint_dir: "outputs/experiments/vit/checkpoints"
  logging:
    run_id: "vit_standalone"
    output_dir: "outputs/experiments/vit/logs"

hardware_budget:
  target_gpu: "NVIDIA GeForce RTX 3050 Laptop GPU (4GB VRAM)"
  max_estimated_vit_params: 300000
  recommended_smoke_batch_size: 8
